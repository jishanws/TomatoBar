name: main

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Delete old prerelease
        if: github.ref_type == 'branch'
        uses: dev-drprasad/delete-tag-and-release@v1.1
        continue-on-error: true
        with:
          delete_release: true
          tag_name: prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Build
        run: |
          BUILT_PRODUCTS_DIR=$(xcodebuild -project TomatoBar.xcodeproj -scheme TomatoBar -configuration Release -showBuildSettings | awk '/^ *BUILT_PRODUCTS_DIR = / {print $3}')
          xcodebuild build -project TomatoBar.xcodeproj -scheme TomatoBar -configuration Release MARKETING_VERSION=${{ env.version }} CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Automatic ONLY_ACTIVE_ARCH=NO
          codesign --force --deep -s - "$BUILT_PRODUCTS_DIR/TomatoBar.app"
          cp -r "$BUILT_PRODUCTS_DIR/TomatoBar.app" .
          zip -r "TomatoBar-${{ env.version }}.zip" "TomatoBar.app"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomatoBar-${{ env.version }}
          path: TomatoBar-${{ env.version }}.zip

      - name: Release (Tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: TomatoBar-${{ env.version }}.zip

      - name: Prerelease (Branch)
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: prerelease
          prerelease: true
          files: TomatoBar-${{ env.version }}.zip
